---
# ~/cloudseed-secrets.json (Ubuntu Pro token, Tailscale auth key) is written by `cloudseed provision` right before the
# play. Read it into a fact and delete it at once, so the secret is on disk only for the few seconds before this, and
# never after a failure later in the play (`cloudseed provision` also removes it when the run ends, whatever happened).
- name: Read provisioning secrets
  ansible.builtin.slurp:
    src: "/home/{{ ssh_user }}/cloudseed-secrets.json"
  register: cs_secrets_file
  failed_when: false
  no_log: true

- name: Provisioning secrets for the roles
  ansible.builtin.set_fact:
    cs_secrets: "{{ (cs_secrets_file.content | b64decode | from_json) if (cs_secrets_file.content | default('')) | length > 0 else {} }}"
  no_log: true

- name: Remove provisioning secrets from disk
  ansible.builtin.file:
    path: "/home/{{ ssh_user }}/cloudseed-secrets.json"
    state: absent
