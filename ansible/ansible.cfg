[defaults]
# no default inventory: every cloudseed run passes -i (bootstrap.sh: -i localhost,). The setting is a *path* list,
# so `localhost,` here made Ansible parse this directory (and execute bootstrap.sh) as an inventory source.
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
# SSH host keys are checked against the environment's known_hosts (the inventory's StrictHostKeyChecking=accept-new
# handles first contact). False would make Ansible pass StrictHostKeyChecking=no ahead of it and accept a changed key.
host_key_checking = True
# a failed run still restarts/reloads what it changed (sshd, nftables, fail2ban): the next run sees no change and
# would never notify them again
force_handlers = True
