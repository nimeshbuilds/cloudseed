---
- name: Refresh package cache (Debian family)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Base packages (Debian family)
  ansible.builtin.apt:
    name: [git, curl, unzip, jq, tmux, vim, htop, python3, python3-venv, python3-pip, ca-certificates, gnupg, tar, less, dnsutils, net-tools]
    state: present
  when: ansible_facts['os_family'] == 'Debian'

# No `curl` here: Amazon Linux 2023 ships curl-minimal (it provides /usr/bin/curl), and asking dnf for `curl` by name
# selects the full curl package, which conflicts with the installed curl-minimal and fails the whole transaction.
- name: Base packages (Amazon Linux / RedHat family)
  ansible.builtin.dnf:
    name: [git, unzip, jq, tmux, vim, htop, python3, python3-pip, ca-certificates, tar, less, bind-utils]
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

# Timezone with builtin modules only (no community.general collection needed on the host).
- name: UTC zone file
  ansible.builtin.stat:
    path: /usr/share/zoneinfo/Etc/UTC
  register: utc_zone

- name: Timezone UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    state: link
    force: true
  when: utc_zone.stat.exists

- name: Timezone name (Debian family)
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "Etc/UTC\n"
    mode: "0644"
  when: utc_zone.stat.exists and ansible_facts['os_family'] == 'Debian'

- name: Login message
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: "0644"

- name: Ensure ~/.local/bin for the login user
  ansible.builtin.file:
    path: "/home/{{ ssh_user }}/.local/bin"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0755"

- name: Require the portable Cloudseed launcher and source payload
  ansible.builtin.assert:
    that:
      - (repo_dir + '/bin/cloudseed') is file
      - (repo_dir + '/cloudseed/__init__.py') is file
      - (repo_dir + '/cloudseed/cli.py') is file
    fail_msg: "The provisioned Cloudseed payload is incomplete. Re-run provisioning from a current Cloudseed checkout or rebuilt release binary."
    quiet: true

- name: Inspect existing Cloudseed command paths
  ansible.builtin.stat:
    path: "/home/{{ ssh_user }}/.local/bin/{{ item }}"
    follow: false
  loop: [cloudseed, cs]
  register: cloudseed_command_paths

- name: Keep unrelated commands intact
  ansible.builtin.assert:
    that: >-
      not item.stat.exists | default(false) or
      (item.stat.islnk | default(false) and item.stat.lnk_source | default('') == ((repo_dir + '/bin/cloudseed') | realpath))
    fail_msg: "{{ item.item }} already exists in the login user's ~/.local/bin and is not this Cloudseed install. Move or rename that command before re-provisioning; it was left unchanged."
    quiet: true
  loop: "{{ cloudseed_command_paths.results }}"

- name: Make the portable Cloudseed launcher executable
  ansible.builtin.file:
    path: "{{ repo_dir }}/bin/cloudseed"
    mode: "0755"

- name: Link cloudseed and cs into ~/.local/bin
  ansible.builtin.file:
    src: "{{ repo_dir }}/bin/cloudseed"
    dest: "/home/{{ ssh_user }}/.local/bin/{{ item }}"
    state: link
    force: true
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
  loop: [cloudseed, cs]

- name: PATH includes ~/.local/bin before noninteractive shell guards
  ansible.builtin.blockinfile:
    path: "/home/{{ ssh_user }}/{{ item }}"
    block: 'export PATH="$HOME/.local/bin:$HOME/.cloudseed/bin:$PATH"'
    marker: "# {mark} cloudseed command path"
    insertbefore: BOF
    create: true
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0644"
  loop: [.profile, .bashrc]

- name: Inspect an existing Bash login profile
  ansible.builtin.stat:
    path: "/home/{{ ssh_user }}/.bash_profile"
  register: cloudseed_bash_profile

- name: PATH includes ~/.local/bin when Bash uses its own login profile
  ansible.builtin.blockinfile:
    path: "/home/{{ ssh_user }}/.bash_profile"
    block: 'export PATH="$HOME/.local/bin:$HOME/.cloudseed/bin:$PATH"'
    marker: "# {mark} cloudseed command path"
    insertbefore: BOF
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0644"
  when: cloudseed_bash_profile.stat.exists

- name: Verify both Cloudseed commands without using the login user's configuration
  become: false
  ansible.builtin.shell: |
    set -eu
    check_home=$(mktemp -d)
    trap 'rm -rf "$check_home"' EXIT
    export CLOUDSEED_HOME="$check_home" PYTHONDONTWRITEBYTECODE=1
    "{{ repo_dir }}/bin/cloudseed" --version
    "/home/{{ ssh_user }}/.local/bin/cloudseed" --version
    "/home/{{ ssh_user }}/.local/bin/cs" --version
    "/home/{{ ssh_user }}/.local/bin/cs" help >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
