---
# Easy-RSA settings, written to the vars file and exported to every easyrsa call (role tasks and cloudseed-vpn-client):
# EC P-384 keys, a 10-year CA and CRL, 825-day certificates (the role renews the server's within 30 days of expiry,
# `cloudseed vpn add-user` a client's). EASYRSA_REQ_CN must never be set here (see tasks).
easyrsa_env:
  EASYRSA_ALGO: ec
  EASYRSA_CURVE: secp384r1
  EASYRSA_DIGEST: sha256
  EASYRSA_CA_EXPIRE: "3650"
  EASYRSA_CERT_EXPIRE: "825"
  EASYRSA_CRL_DAYS: "3650"
  EASYRSA_BATCH: "1"
