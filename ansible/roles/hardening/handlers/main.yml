---
# Handlers run in the order they are listed here. The ruleset starts with `flush ruleset`, which also drops
# fail2ban's own nftables table, so nftables is reloaded before fail2ban (re)starts and rebuilds it.
- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: reload nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    enabled: true

# after a ruleset reload: restart fail2ban only where it is running (rc 5: not installed, e.g. --no-harden)
- name: resync fail2ban
  ansible.builtin.command: systemctl try-restart fail2ban.service
  register: f2b_resync
  changed_when: f2b_resync.rc == 0
  failed_when: f2b_resync.rc not in [0, 5]

- name: restart sshd
  ansible.builtin.systemd:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: restarted

- name: restart auditd
  ansible.builtin.command: augenrules --load
  changed_when: true
  failed_when: false
