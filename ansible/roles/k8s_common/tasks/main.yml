---
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Kernel modules for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

# builtin modules only (no community.general collection); modules-load.d above makes it persistent
- name: Load kernel modules
  ansible.builtin.command: modprobe {{ item }}
  loop: [overlay, br_netfilter]
  changed_when: false

- name: Kubernetes sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-kubernetes.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      fs.inotify.max_user_instances       = 8192
      fs.inotify.max_user_watches         = 524288

- name: Apply sysctls
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: apt repository files readable by apt's sandbox user (hardened umask is 027)
  ansible.builtin.shell: |
    for d in /etc/apt/sources.list.d /etc/apt/keyrings /usr/share/keyrings; do
      [ -d "$d" ] && find "$d" -type f ! -perm -o=r -exec chmod 0644 {} +
    done
    true
  changed_when: false

- name: Node packages
  ansible.builtin.apt:
    name: [curl, gnupg, apt-transport-https, ca-certificates, conntrack, socat, ipset, ethtool, nfs-common, open-iscsi]
    state: present
    update_cache: true

- name: Hosts entries for all nodes
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    regexp: "\\s{{ item }}$"
  loop: "{{ groups['k8s'] }}"
