<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="cloudseed: multi-cloud landing zones and Kubernetes platforms from one command">
  <!-- Source of og-image.png (1200x630 social card). Re-render: headless Chrome screenshot at 1200x630, or
       rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png (fonts then depend on fontconfig). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset=".45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.86" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#4f7df3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4f7df3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeaf" cx="0.02" cy="1.02" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSeed" cx="0.6" cy="1.1" r="0.35">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask" cx="0.6" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="630" fill="url(#gridMask)"/></mask>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset=".45" stop-color="#86efac"/>
      <stop offset="1" stop-color="#9db6ff"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="seed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="gcp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="az" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#fade)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowLeaf)"/>
  <rect width="1200" height="630" fill="url(#glowSeed)"/>

  <!-- brand -->
  <g transform="translate(72 58) scale(0.140625)">
    <rect width="512" height="512" rx="112" fill="url(#iconBg)" stroke="#ffffff" stroke-opacity=".16" stroke-width="6"/>
    <path fill="url(#cloud)" d="M148 328h224a56 56 0 0 0 6-111.7A88 88 0 0 0 208 190a64 64 0 0 0-108 44.6A48 48 0 0 0 148 328z"/>
    <path fill="#1e3a8a" d="M256 226a22 22 0 0 0-22 22c0 8.6 5 16 12.3 19.6L240 300h32l-6.3-32.4A22 22 0 0 0 256 226z"/>
    <rect x="120" y="372" width="272" height="12" rx="6" fill="#93c5fd" opacity="0.6"/>
    <path d="M256 372v-64" stroke="url(#leaf)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path fill="url(#leaf)" d="M256 322c-6-40-40-56-74-50 6 34 32 56 74 50z"/>
    <path fill="url(#leaf)" d="M256 338c8-38 42-54 74-48-4 34-30 56-74 48z"/>
    <ellipse cx="256" cy="396" rx="26" ry="16" fill="url(#seed)"/>
  </g>
  <text x="160" y="112" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" fill="#ffffff">cloud<tspan fill="#4ade80">seed</tspan></text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="408" y="78" width="178" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="430" cy="97" r="6" fill="#4ade80"/>
    <text x="446" y="104" font-size="19" font-weight="600" fill="#c7d2fe">Open source</text>
  </g>

  <!-- headline -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-2.2">
    <text x="70" y="240" font-size="62" fill="#ffffff">Multi-cloud landing zones</text>
    <text x="70" y="312" font-size="62" fill="#ffffff">and Kubernetes platforms,</text>
    <text x="70" y="384" font-size="62" fill="url(#headline)">from one command.</text>
  </g>

  <!-- targets -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(72 440)">
      <rect width="40" height="40" rx="10" fill="url(#aws)"/>
      <text x="20" y="25.5" text-anchor="middle" font-size="13" font-weight="800" fill="#1f2937">AWS</text>
      <text x="54" y="28" font-size="22" font-weight="600" fill="#e2e8f0">AWS</text>
    </g>
    <g transform="translate(190 440)">
      <rect width="40" height="40" rx="10" fill="url(#gcp)"/>
      <text x="20" y="25.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">GCP</text>
      <text x="54" y="28" font-size="22" font-weight="600" fill="#e2e8f0">Google Cloud</text>
    </g>
    <g transform="translate(398 440)">
      <rect width="40" height="40" rx="10" fill="url(#az)"/>
      <text x="20" y="25.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">AZ</text>
      <text x="54" y="28" font-size="22" font-weight="600" fill="#e2e8f0">Azure</text>
    </g>
    <g transform="translate(526 440)">
      <rect width="40" height="40" rx="10" fill="url(#vm)"/>
      <text x="20" y="25.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">VM</text>
      <text x="54" y="28" font-size="22" font-weight="600" fill="#e2e8f0">VMware</text>
    </g>
  </g>

  <!-- footer line -->
  <line x1="72" y1="530" x2="1128" y2="530" stroke="#ffffff" stroke-opacity=".1"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">
    <text x="72" y="574" fill="#cbd5e1" font-weight="500">Terraform + Ansible · web console · MCP server · AI-agent mode</text>
    <text x="1128" y="574" text-anchor="end" fill="#4ade80" font-weight="700">nimeshbuilds.github.io/cloudseed</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(846 150)" filter="url(#shadow)">
    <rect width="292" height="300" rx="16" fill="#050914" fill-opacity=".92" stroke="#94a3b8" stroke-opacity=".25"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
    <line x1="0" y1="44" x2="292" y2="44" stroke="#94a3b8" stroke-opacity=".15"/>
    <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
      <text x="18" y="76"><tspan fill="#4ade80" font-weight="700">❯</tspan><tspan fill="#ffffff" font-weight="600"> cs setup aws</tspan></text>
      <text x="18" y="102" fill="#dbe4f3"><tspan fill="#4ade80">✔</tspan> VPC · NAT · flow logs</text>
      <text x="18" y="128" fill="#dbe4f3"><tspan fill="#4ade80">✔</tspan> bastion: your IP only</text>
      <text x="18" y="162"><tspan fill="#4ade80" font-weight="700">❯</tspan><tspan fill="#ffffff" font-weight="600"> cs platform install basek8s</tspan></text>
      <text x="18" y="188" fill="#dbe4f3"><tspan fill="#4ade80">✔</tspan> ArgoCD · Prometheus</text>
      <text x="18" y="214" fill="#dbe4f3"><tspan fill="#4ade80">✔</tspan> Gateway API · Envoy</text>
      <text x="18" y="248"><tspan fill="#4ade80" font-weight="700">❯</tspan><tspan fill="#ffffff" font-weight="600"> cs dr test</tspan></text>
      <text x="18" y="274" fill="#4ade80" font-weight="800">PASS <tspan fill="#8391ab" font-weight="400">· restore verified</tspan></text>
    </g>
  </g>
</svg>
