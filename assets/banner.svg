<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="cloudseed social banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.6" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="seed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <!-- glow -->
  <circle cx="300" cy="320" r="230" fill="#22c55e" opacity="0.08"/>
  <circle cx="300" cy="320" r="150" fill="#3b82f6" opacity="0.10"/>
  <!-- icon -->
  <g transform="translate(140 160) scale(0.625)">
    <rect width="512" height="512" rx="112" fill="url(#tile)" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="4"/>
    <path fill="url(#cloud)" d="M148 328h224a56 56 0 0 0 6-111.7A88 88 0 0 0 208 190a64 64 0 0 0-108 44.6A48 48 0 0 0 148 328z"/>
    <path fill="#1e3a8a" d="M256 226a22 22 0 0 0-22 22c0 8.6 5 16 12.3 19.6L240 300h32l-6.3-32.4A22 22 0 0 0 256 226z"/>
    <rect x="120" y="372" width="272" height="12" rx="6" fill="#93c5fd" opacity="0.6"/>
    <path d="M256 372v-64" stroke="url(#leaf)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path fill="url(#leaf)" d="M256 322c-6-40-40-56-74-50 6 34 32 56 74 50z"/>
    <path fill="url(#leaf)" d="M256 338c8-38 42-54 74-48-4 34-30 56-74 48z"/>
    <ellipse cx="256" cy="396" rx="26" ry="16" fill="url(#seed)"/>
  </g>
  <!-- text -->
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="540" y="250" font-size="96" font-weight="800" fill="#f8fafc" letter-spacing="-3">cloud<tspan fill="#4ade80">seed</tspan></text>
    <text x="544" y="310" font-size="34" font-weight="500" fill="#cbd5e1">Secure multi-cloud landing zones, from scratch.</text>
    <text x="544" y="356" font-size="26" fill="#94a3b8">VPC · private subnets · NAT · hardened bastion · audit logging</text>
    <text x="544" y="394" font-size="26" fill="#94a3b8">Terraform under the hood · deterministic or agentic</text>
    <!-- cloud chips -->
    <g font-size="22" font-weight="700">
      <rect x="544" y="430" width="96" height="44" rx="22" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="592" y="459" text-anchor="middle" fill="#fbbf24">AWS</text>
      <rect x="656" y="430" width="96" height="44" rx="22" fill="#3b82f6" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="704" y="459" text-anchor="middle" fill="#93c5fd">GCP</text>
      <rect x="768" y="430" width="112" height="44" rx="22" fill="#06b6d4" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="824" y="459" text-anchor="middle" fill="#67e8f9">Azure</text>
    </g>
    <!-- terminal line -->
    <rect x="544" y="510" width="600" height="56" rx="10" fill="#020617" stroke="#334155"/>
    <text x="566" y="546" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#e2e8f0"><tspan fill="#4ade80">$</tspan> cs setup aws</text>
  </g>
</svg>
